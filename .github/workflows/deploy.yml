name: Deploy to GitHub Pages

# Builds the static site and publishes it to the gh-pages branch, which is
# what GitHub Pages already serves for this repo. Keeps the existing Pages
# setting ("Deploy from a branch" -> gh-pages) working untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Sanity-check the build is servable
        run: |
          test -f dist/client/index.html || { echo "::error::no index.html - Pages would 404"; exit 1; }
          test -f dist/client/.nojekyll || { echo "::error::missing .nojekyll"; exit 1; }
          grep -q '/Vishal/assets/' dist/client/index.html \
            || { echo "::error::assets are not base-prefixed for /Vishal/"; exit 1; }

      - name: Publish to gh-pages
        run: |
          cd dist/client
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
